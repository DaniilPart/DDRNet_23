CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
GPUS: (0,)
OUTPUT_DIR: 'output/finetune_on_binary_data'
LOG_DIR: 'log/finetune_on_binary_data'
WORKERS: 8
PRINT_FREQ: 100

DATASET:
  DATASET: BinaryMaskDataset
  ROOT: 'data/data_road/'
  TEST_SET: '/home/daniil/PycharmProjects/DDRNet.pytorch/data/list/fcn_dataset/val.lst'
  TRAIN_SET: '/home/daniil/PycharmProjects/DDRNet.pytorch/data/list/fcn_dataset/train.lst'
  NUM_CLASSES: 2

MODEL:
  NAME: ddrnet_23_slim
  NUM_OUTPUTS: 2
  PRETRAINED: "pretrained_models/best_val_smaller.pth"
  ALIGN_CORNERS: false

LOSS:
  USE_OHEM: false
  USE_HYBRID: true
  BALANCE_WEIGHTS: [0.4, 5.0]

TRAIN:
  IMAGE_SIZE:
  - 1024
  - 1024
  BASE_SIZE: 2048
  BATCH_SIZE_PER_GPU: 8
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 300
  RESUME: false
  OPTIMIZER: sgd
  LR: 0.0001
  WD: 0.001
  MOMENTUM: 0.9
  NESTEROV: false
  FLIP: true
  MULTI_SCALE: true
  DOWNSAMPLERATE: 1
  IGNORE_LABEL: 255
  SCALE_FACTOR: 16

TEST:
  IMAGE_SIZE:
  - 1024
  - 1024
  BASE_SIZE: 2048
  BATCH_SIZE_PER_GPU: 8
  FLIP_TEST: false
  MULTI_SCALE: false
  MODEL_FILE: ''
  OUTPUT_INDEX: 1
